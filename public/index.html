<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClientTrack — Lion · Hima Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3e;
    --accent:#7c5cfc;--accent2:#fc5c7d;--gold:#f5c842;--green:#3cffa0;
    --blue:#5cb8fc;--orange:#ff9f43;--text:#e8e8f0;--muted:#6b6b8a;
    --font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
    --s-str:#3cffa0;--s-wk:#fc5c7d;--s-op:#5cb8fc;--s-th:#f5c842;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

  /* ── HEADER ── */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,15,.94);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:16px 28px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:11px;}
  .logo-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 0 16px rgba(124,92,252,.4);}
  .logo-name{font-size:16px;font-weight:800;letter-spacing:-.5px;}
  .logo-sub{font-size:10px;color:var(--muted);font-family:var(--mono);}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stat-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;}
  .stat-pill b{color:var(--text);}
  .save-ind{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid transparent;transition:all .3s;}
  .save-ind.idle{color:var(--muted);border-color:var(--border);}
  .save-ind.saving{color:var(--gold);border-color:rgba(245,200,66,.3);}
  .save-ind.saved{color:var(--green);border-color:rgba(60,255,160,.3);}
  .save-ind.error{color:var(--accent2);border-color:rgba(252,92,125,.3);}

  /* ── TOOLBAR ── */
  .toolbar{padding:18px 28px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn-add{background:linear-gradient(135deg,var(--accent),#5a3fd4);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 12px rgba(124,92,252,.3);transition:transform .15s,box-shadow .15s;}
  .btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(124,92,252,.45);}
  .btn-out{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:8px;font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s;}
  .btn-out:hover{color:var(--text);border-color:var(--green);}
  .search-wrap{position:relative;flex:1;min-width:180px;}
  .search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 36px;border-radius:8px;font-family:var(--mono);font-size:12px;outline:none;transition:border-color .2s;}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
  .ftabs{display:flex;gap:4px;flex-wrap:wrap;}
  .ftab{padding:8px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
  .ftab.active{background:var(--card);color:var(--text);border-color:var(--accent);}

  /* ── PIPELINE ── */
  .pipeline-wrap{padding:18px 28px 40px;overflow-x:auto;}
  .pipeline{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;align-items:start;min-width:900px;}
  .col-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .col-header{padding:11px 15px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
  .col-badge{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .col-body{padding:9px 9px 11px;display:flex;flex-direction:column;gap:9px;}
  .s-new     .col-header{color:var(--muted);  border-bottom:2px solid #2e2e48;}
  .s-audited .col-header{color:var(--blue);   border-bottom:2px solid var(--blue);}
  .s-dm      .col-header{color:var(--accent); border-bottom:2px solid var(--accent);}
  .s-replied .col-header{color:var(--gold);   border-bottom:2px solid var(--gold);}
  .s-closed  .col-header{color:var(--green);  border-bottom:2px solid var(--green);}

  /* ── CARDS ── */
  .client-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 12px 9px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;animation:fadeUp .2s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .client-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 5px 18px rgba(124,92,252,.15);}
  .client-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .s-new     .client-card::before{background:#2e2e48;}
  .s-audited .client-card::before{background:var(--blue);}
  .s-dm      .client-card::before{background:var(--accent);}
  .s-replied .client-card::before{background:var(--gold);}
  .s-closed  .client-card::before{background:var(--green);}

  .card-name{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3;}
  .card-handle{font-size:11px;color:var(--accent);font-family:var(--mono);margin-bottom:7px;}
  .card-tag{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;margin-bottom:6px;background:rgba(124,92,252,.1);color:var(--accent);border:1px solid rgba(124,92,252,.2);}
  .card-weak{font-size:11px;color:var(--muted);background:rgba(252,92,125,.05);border-left:2px solid var(--accent2);border-radius:0 5px 5px 0;padding:5px 7px;margin-bottom:7px;line-height:1.45;}
  .card-notes{font-size:11px;color:var(--muted);background:rgba(124,92,252,.05);border-left:2px solid var(--accent);border-radius:0 5px 5px 0;padding:5px 7px;margin-bottom:7px;line-height:1.45;}

  /* SWOT mini preview on card */
  .card-swot-preview{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px;}
  .swot-chip{border-radius:5px;padding:4px 7px;font-size:10px;font-family:var(--mono);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .swot-chip.S{background:rgba(60,255,160,.07);border-left:2px solid var(--s-str);color:var(--s-str);}
  .swot-chip.W{background:rgba(252,92,125,.07);border-left:2px solid var(--s-wk); color:var(--s-wk);}
  .swot-chip.O{background:rgba(92,184,252,.07);border-left:2px solid var(--s-op); color:var(--s-op);}
  .swot-chip.T{background:rgba(245,200,66,.07);border-left:2px solid var(--s-th); color:var(--s-th);}
  .swot-chip.empty{background:rgba(255,255,255,.02);border-left:2px solid var(--border);color:var(--muted);font-style:italic;}
  .swot-chip-label{font-size:9px;font-weight:700;letter-spacing:.8px;margin-bottom:2px;opacity:.7;}

  .card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .card-date{font-size:10px;color:var(--muted);font-family:var(--mono);}
  .card-actions{display:grid;grid-template-columns:1fr 1fr 1fr 30px;gap:5px;padding-top:7px;border-top:1px solid var(--border);}
  .act{padding:5px 3px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-family:var(--font);cursor:pointer;transition:all .15s;text-align:center;}
  .act:hover{background:rgba(255,255,255,.04);color:var(--text);border-color:var(--accent);}
  .act.del:hover{border-color:var(--accent2);color:var(--accent2);}
  .act:disabled{opacity:.2;cursor:default;}
  .empty-slot{text-align:center;padding:20px 12px;color:var(--muted);font-size:11px;font-family:var(--mono);border:1px dashed var(--border);border-radius:8px;line-height:1.7;}

  /* ── MODAL ── */
  .modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.hidden{display:none;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:620px;padding:28px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:modalIn .2s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:none;}}
  .modal h2{font-size:19px;font-weight:800;margin-bottom:20px;letter-spacing:-.5px;}

  /* Tabs inside modal */
  .modal-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;}
  .mtab{padding:8px 16px;border-radius:7px 7px 0 0;border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;margin-bottom:-1px;}
  .mtab.active{background:var(--surface);color:var(--text);border-color:var(--border);border-bottom-color:var(--surface);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .fgrid .full{grid-column:1/-1;}
  .fg label{display:block;font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;}
  .fg input,.fg select,.fg textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;}
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);}
  .fg textarea{resize:vertical;min-height:65px;line-height:1.5;}
  select option{background:#1a1a26;}

  /* SWOT grid in modal */
  .swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
  .swot-box label{display:flex;align-items:center;gap:6px;font-size:10px;font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
  .swot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .swot-box textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:var(--font);font-size:12px;outline:none;resize:vertical;min-height:90px;line-height:1.5;transition:border-color .2s;}
  .swot-box.S textarea:focus{border-color:var(--s-str);}
  .swot-box.W textarea:focus{border-color:var(--s-wk);}
  .swot-box.O textarea:focus{border-color:var(--s-op);}
  .swot-box.T textarea:focus{border-color:var(--s-th);}
  .swot-hint{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:14px;line-height:1.6;padding:10px 12px;background:rgba(255,255,255,.02);border-radius:7px;border:1px solid var(--border);}

  .stars-row{display:flex;gap:5px;margin-top:2px;}
  .star-btn{font-size:22px;background:none;border:none;cursor:pointer;opacity:.22;transition:opacity .1s,transform .1s;line-height:1;padding:0;}
  .star-btn.on{opacity:1;}
  .star-btn:hover{transform:scale(1.2);opacity:.75;}

  .modal-footer{display:flex;gap:10px;margin-top:22px;}
  .btn-save{flex:1;background:linear-gradient(135deg,var(--accent),#5a3fd4);color:#fff;border:none;padding:12px;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(124,92,252,.3);transition:opacity .15s;}
  .btn-save:hover{opacity:.9;}
  .btn-cancel{padding:12px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:14px;cursor:pointer;transition:all .15s;}
  .btn-cancel:hover{color:var(--text);border-color:var(--text);}

  /* Toast */
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 22px;border-radius:30px;font-size:12px;font-family:var(--mono);box-shadow:0 8px 28px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;z-index:300;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  @media(max-width:640px){
    .swot-grid,.fgrid{grid-template-columns:1fr;}
    .fgrid .full{grid-column:1;}
    header{padding:12px 16px;}
    .toolbar,.pipeline-wrap{padding-left:14px;padding-right:14px;}
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-mark">L</div>
    <div>
      <div class="logo-name">ClientTrack</div>
      <div class="logo-sub">Lion · Hima Tech · Zanzibar</div>
    </div>
  </div>
  <div class="header-right">
    <div id="saveInd" class="save-ind idle">● idle</div>
    <div class="stat-pill">Total <b id="sTotal">0</b></div>
    <div class="stat-pill">DM Sent <b id="sDM">0</b></div>
    <div class="stat-pill" style="border-color:rgba(60,255,160,.25);color:var(--green)">Won <b id="sWon">0</b></div>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="btn-add" onclick="openModal()">＋ Add Client</button>
  <button class="btn-out" onclick="exportJSON()">↓ Download JSON</button>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search clients…" oninput="render()"/>
  </div>
  <div class="ftabs">
    <button class="ftab active" onclick="setFilter(this,'all')">All</button>
    <button class="ftab" onclick="setFilter(this,'new')">New</button>
    <button class="ftab" onclick="setFilter(this,'audited')">Audited</button>
    <button class="ftab" onclick="setFilter(this,'dm_sent')">DM Sent</button>
    <button class="ftab" onclick="setFilter(this,'replied')">Replied</button>
    <button class="ftab" onclick="setFilter(this,'closed')">Won</button>
  </div>
</div>

<!-- PIPELINE -->
<div class="pipeline-wrap">
  <div class="pipeline" id="pipeline"></div>
</div>

<!-- MODAL -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Add Client</h2>

    <!-- Modal tabs -->
    <div class="modal-tabs">
      <button class="mtab active" onclick="switchTab(this,'tab-info')">📋 Info</button>
      <button class="mtab" onclick="switchTab(this,'tab-swot')">⚡ SWOT</button>
    </div>

    <!-- TAB: Info -->
    <div class="tab-panel active" id="tab-info">
      <div class="fgrid">
        <div class="fg full"><label>Org Name *</label><input id="f-name" type="text" placeholder="e.g. Promoting Women in Tourism"/></div>
        <div class="fg"><label>Handle / Social</label><input id="f-handle" type="text" placeholder="@handle"/></div>
        <div class="fg"><label>Channel</label>
          <select id="f-channel">
            <option value="">— Select —</option>
            <option>Instagram</option><option>LinkedIn</option><option>WhatsApp</option>
            <option>Email</option><option>Facebook</option><option>Twitter/X</option><option>Website</option>
          </select>
        </div>
        <div class="fg full"><label>Website URL</label><input id="f-url" type="text" placeholder="https://…"/></div>
        <div class="fg"><label>Contact Person</label><input id="f-contact" type="text" placeholder="Name or role"/></div>
        <div class="fg"><label>Status</label>
          <select id="f-status">
            <option value="new">🆕 New</option>
            <option value="audited">🔍 Audited</option>
            <option value="dm_sent">📨 DM Sent</option>
            <option value="replied">💬 Replied</option>
            <option value="closed">✅ Won / Closed</option>
          </select>
        </div>
        <div class="fg full"><label>Weakness Spotted</label><textarea id="f-weak" placeholder="e.g. Vague About section, no social presence…"></textarea></div>
        <div class="fg full"><label>Notes / Next Step</label><textarea id="f-notes" placeholder="Follow-up date, what to offer, extra context…"></textarea></div>
        <div class="fg full">
          <label>Priority Score</label>
          <div class="stars-row">
            <button class="star-btn" data-v="1" onclick="setScore(1)" type="button">★</button>
            <button class="star-btn" data-v="2" onclick="setScore(2)" type="button">★</button>
            <button class="star-btn" data-v="3" onclick="setScore(3)" type="button">★</button>
            <button class="star-btn" data-v="4" onclick="setScore(4)" type="button">★</button>
            <button class="star-btn" data-v="5" onclick="setScore(5)" type="button">★</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: SWOT -->
    <div class="tab-panel" id="tab-swot">
      <div class="swot-hint">
        Analyze this org's SWOT to shape your pitch. What are they doing well? Where do they struggle? Where can <em>you</em> help?
      </div>
      <div class="swot-grid">
        <div class="swot-box S">
          <label><span class="swot-dot" style="background:var(--s-str)"></span>Strengths</label>
          <textarea id="f-swot-s" placeholder="What do they do well? Strong mission, active community, good reputation, funding…"></textarea>
        </div>
        <div class="swot-box W">
          <label><span class="swot-dot" style="background:var(--s-wk)"></span>Weaknesses</label>
          <textarea id="f-swot-w" placeholder="Poor website copy, no social, unclear messaging, bad donor comms, no newsletter…"></textarea>
        </div>
        <div class="swot-box O">
          <label><span class="swot-dot" style="background:var(--s-op)"></span>Opportunities</label>
          <textarea id="f-swot-o" placeholder="Where you can help — rewrite their About, build content calendar, campaign copy…"></textarea>
        </div>
        <div class="swot-box T">
          <label><span class="swot-dot" style="background:var(--s-th)"></span>Threats / Risks</label>
          <textarea id="f-swot-t" placeholder="Budget constraints, internal comms team, competitor freelancers, slow decisions…"></textarea>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-save" onclick="saveClient()">Save Client</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────
let clients = [], editId = null, scoreVal = 3, activeFilter = 'all', saveTimer = null;

const COLS = [
  {id:'new',    label:'New',    emoji:'🆕',cls:'s-new'},
  {id:'audited',label:'Audited',emoji:'🔍',cls:'s-audited'},
  {id:'dm_sent',label:'DM Sent',emoji:'📨',cls:'s-dm'},
  {id:'replied',label:'Replied',emoji:'💬',cls:'s-replied'},
  {id:'closed', label:'Won ✓', emoji:'✅',cls:'s-closed'},
];

// ── Utils ──────────────────────────────────────────
const uid   = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const today = () => new Date().toISOString().slice(0,10);
const esc   = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const stars = n  => `<span style="color:var(--gold)">${'★'.repeat(n)}</span><span style="color:var(--border)">${'★'.repeat(5-n)}</span>`;

function toast(msg, dur=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── Save indicator ─────────────────────────────────
function setInd(state) {
  const el = document.getElementById('saveInd');
  const map = {idle:'● idle', saving:'↑ saving…', saved:'✓ saved to disk', error:'✕ save failed'};
  el.className = `save-ind ${state}`; el.textContent = map[state];
}

// ── Auto-save ──────────────────────────────────────
async function autoSave() {
  setInd('saving');
  try {
    const res = await fetch('/api/clients', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(clients)
    });
    if (!res.ok) throw new Error();
    setInd('saved'); setTimeout(()=>setInd('idle'), 2500);
  } catch { setInd('error'); toast('⚠ Save failed — is server running?', 3000); }
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 400); }

// ── Load ───────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('/api/clients');
    clients   = await res.json();
  } catch { toast('⚠ Could not connect to server',3000); clients = []; }
  render();
}

// ── Filter ─────────────────────────────────────────
function setFilter(el, val) {
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); activeFilter = val; render();
}

// ── Modal tabs ─────────────────────────────────────
function switchTab(el, panelId) {
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(panelId).classList.add('active');
}

// ── Render ─────────────────────────────────────────
function render() {
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const filtered = clients.filter(c => {
    const txt = (c.name+c.handle+(c.notes||'')+(c.weak||'')+(c.contact||'')+(c.swot?.s||'')+(c.swot?.w||'')+(c.swot?.o||'')+(c.swot?.t||'')).toLowerCase();
    return (!q||txt.includes(q)) && (activeFilter==='all'||c.status===activeFilter);
  });

  document.getElementById('sTotal').textContent = clients.length;
  document.getElementById('sDM').textContent    = clients.filter(c=>['dm_sent','replied','closed'].includes(c.status)).length;
  document.getElementById('sWon').textContent   = clients.filter(c=>c.status==='closed').length;

  const pipe = document.getElementById('pipeline');
  pipe.innerHTML = '';

  COLS.forEach((col, colIdx) => {
    const cards = filtered.filter(c=>c.status===col.id).sort((a,b)=>b.score-a.score);
    const wrap  = document.createElement('div');
    wrap.className = `col-wrap ${col.cls}`;
    wrap.innerHTML = `<div class="col-header"><span>${col.emoji} ${col.label}</span><span class="col-badge">${cards.length}</span></div><div class="col-body" id="col-${col.id}"></div>`;
    pipe.appendChild(wrap);

    const body = wrap.querySelector('.col-body');
    if (!cards.length) { body.innerHTML=`<div class="empty-slot">No clients<br>in this stage</div>`; return; }

    cards.forEach(c => {
      const sw = c.swot || {};
      const hasSWOT = sw.s||sw.w||sw.o||sw.t;

      const swotPreview = hasSWOT ? `
        <div class="card-swot-preview">
          <div class="swot-chip S ${sw.s?'':'empty'}">
            <div class="swot-chip-label">S</div>
            ${sw.s ? esc(sw.s) : 'not filled'}
          </div>
          <div class="swot-chip W ${sw.w?'':'empty'}">
            <div class="swot-chip-label">W</div>
            ${sw.w ? esc(sw.w) : 'not filled'}
          </div>
          <div class="swot-chip O ${sw.o?'':'empty'}">
            <div class="swot-chip-label">O</div>
            ${sw.o ? esc(sw.o) : 'not filled'}
          </div>
          <div class="swot-chip T ${sw.t?'':'empty'}">
            <div class="swot-chip-label">T</div>
            ${sw.t ? esc(sw.t) : 'not filled'}
          </div>
        </div>` : '';

      const div = document.createElement('div');
      div.className = 'client-card';
      div.innerHTML = `
        <div class="card-name">${esc(c.name)}</div>
        <div class="card-handle">${esc(c.handle)}${c.channel?' &middot; '+esc(c.channel):''}</div>
        ${c.url?`<a href="${esc(c.url)}" target="_blank" style="font-size:10px;font-family:var(--mono);color:var(--blue);text-decoration:none;display:block;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.url)}</a>`:''}
        ${c.contact?`<div class="card-tag">👤 ${esc(c.contact)}</div>`:''}
        ${c.weak?`<div class="card-weak">${esc(c.weak)}</div>`:''}
        ${c.notes?`<div class="card-notes">${esc(c.notes)}</div>`:''}
        ${swotPreview}
        <div class="card-meta">
          <span class="card-date">${c.date}</span>
          <span>${stars(c.score)}</span>
        </div>
        <div class="card-actions">
          <button class="act" onclick="move('${c.id}',-1)" ${colIdx===0?'disabled':''}>◀ Back</button>
          <button class="act" onclick="openModal('${c.id}')">✏ Edit</button>
          <button class="act" onclick="move('${c.id}',1)"  ${colIdx===COLS.length-1?'disabled':''}>Next ▶</button>
          <button class="act del" onclick="del('${c.id}')">✕</button>
        </div>`;
      body.appendChild(div);
    });
  });
}

// ── Move / Delete ──────────────────────────────────
function move(id, dir) {
  const c = clients.find(x=>x.id===id);
  const idx = COLS.findIndex(col=>col.id===c.status);
  const nIdx = idx+dir;
  if (nIdx<0||nIdx>=COLS.length) return;
  c.status = COLS[nIdx].id;
  scheduleSave(); render(); toast(`Moved to ${COLS[nIdx].label}`);
}
function del(id) {
  if (!confirm('Remove this client?')) return;
  clients = clients.filter(c=>c.id!==id);
  scheduleSave(); render(); toast('Client removed');
}

// ── Modal ──────────────────────────────────────────
function openModal(id) {
  editId = id||null;
  const c = id ? clients.find(x=>x.id===id) : null;
  const sw = c?.swot || {};
  document.getElementById('modalTitle').textContent = id ? 'Edit Client' : 'Add Client';
  document.getElementById('f-name').value    = c?.name    || '';
  document.getElementById('f-handle').value  = c?.handle  || '';
  document.getElementById('f-channel').value = c?.channel || '';
  document.getElementById('f-url').value     = c?.url     || '';
  document.getElementById('f-contact').value = c?.contact || '';
  document.getElementById('f-status').value  = c?.status  || 'new';
  document.getElementById('f-weak').value    = c?.weak    || '';
  document.getElementById('f-notes').value   = c?.notes   || '';
  document.getElementById('f-swot-s').value  = sw.s || '';
  document.getElementById('f-swot-w').value  = sw.w || '';
  document.getElementById('f-swot-o').value  = sw.o || '';
  document.getElementById('f-swot-t').value  = sw.t || '';
  setScore(c?.score ?? 3);
  // Reset to info tab
  switchTab(document.querySelector('.mtab'), 'tab-info');
  document.getElementById('modalBg').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-name').focus(), 80);
}
function closeModal() { document.getElementById('modalBg').classList.add('hidden'); editId=null; }

function setScore(v) {
  scoreVal=v;
  document.querySelectorAll('.star-btn').forEach(s=>s.classList.toggle('on',parseInt(s.dataset.v)<=v));
}

function saveClient() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please enter an org name.'); return; }
  const data = {
    name, score:scoreVal, date:today(),
    handle:  document.getElementById('f-handle').value.trim(),
    channel: document.getElementById('f-channel').value,
    url:     document.getElementById('f-url').value.trim(),
    contact: document.getElementById('f-contact').value.trim(),
    status:  document.getElementById('f-status').value,
    weak:    document.getElementById('f-weak').value.trim(),
    notes:   document.getElementById('f-notes').value.trim(),
    swot: {
      s: document.getElementById('f-swot-s').value.trim(),
      w: document.getElementById('f-swot-w').value.trim(),
      o: document.getElementById('f-swot-o').value.trim(),
      t: document.getElementById('f-swot-t').value.trim(),
    }
  };
  if (editId) {
    const i = clients.findIndex(c=>c.id===editId);
    clients[i] = {...clients[i],...data};
    toast('Client updated ✓');
  } else {
    clients.push({id:uid(),...data});
    toast('Client added ✓');
  }
  scheduleSave(); render(); closeModal();
}

// ── Export ─────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(clients,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'clients-'+today()+'.json';
  a.click(); toast('Downloaded ✓');
}

// ── Events ─────────────────────────────────────────
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target===document.getElementById('modalBg')) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

loadData();
</script>
</body>
</html>
